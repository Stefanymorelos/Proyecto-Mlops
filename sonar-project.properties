sonar.projectKey=Stefanymorelos_Proyecto-Mlops
sonar.organization=stefanymorelos

# Nombre y version mostrados en la interfaz de SonarCloud.
sonar.projectName=Proyecto-Mlops
sonar.projectVersion=1.0

# Carpeta con el codigo fuente a analizar.
sonar.sources=mlops_pipeline

# Codificacion del codigo fuente.
sonar.sourceEncoding=UTF-8

# Version de Python usada en el proyecto.
sonar.python.version=3.11

# Reporte de cobertura de pruebas (lo genera pytest-cov en el workflow).
sonar.python.coverage.reportPaths=coverage.xml

# No analizar datos, entornos virtuales ni notebooks (Sonar no los interpreta bien).
sonar.exclusions=**/*.csv,**/venv/**,**/*.ipynb,**/graficas/**
